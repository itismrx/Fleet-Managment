   <div class="stack"><b class="strong">Company</b><div class="fgrid">${input('Legal name', 'e.g. Abay Freight PLC', { req: 1, cls: 'full', id: 'nt-n' })}${input('TIN', '10 digits', { req: 1, id: 'nt-t' })}${input('VAT registration no.', '', { id: 'nt-v' })}${select('City', ['Addis Ababa', 'Adama', 'Dire Dawa', 'Hawassa', 'Mekelle', 'Bahir Dar', 'Gondar', 'Jimma'], { id: 'nt-c' })}${select('Fleet size', ['1–25 vehicles', '26–150 vehicles', '150+ vehicles'], { id: 'nt-fs' })}${input('Workspace address', '', { val: 'abayfreight', addon: 'app.trucksload.com/', cls: 'full', id: 'nt-w' })}</div></div>
   <div class="stack"><b class="strong">Plan</b><div class="grid g3" style="gap:12px">${PLANS.map((p, i) => `<label class="card" style="padding:14px;cursor:pointer;${i === 1 ? 'border-color:var(--border-brand);box-shadow:var(--ring-brand)' : ''}"><b class="strong">${p.name}</b><div class="tnum" style="font-weight:600;margin-top:4px">${p.price}</div><div class="small muted">${p.limit}</div></label>`).join('')}</div><div class="fgrid">${select('Billing', ['Monthly', 'Annual (10% off)'], { id: 'nt-b' })}${select('Start with', ['14-day free trial', 'Paid from today'], { id: 'nt-tr' })}</div></div>
   <div class="stack"><b class="strong">First admin</b><div class="fgrid">${input('Full name', '', { req: 1, id: 'nt-an' })}${input('Phone', '+251', { req: 1, id: 'nt-ap' })}${input('Email', '', { cls: 'full', id: 'nt-ae' })}</div><div class="row between"><span>Import vehicles and drivers for them after creating</span>${toggle(true)}</div></div></div>`, 'Create tenant', 'Tenant created · invite sent to admin'],
  tadduser: ['Add employee', 'Create an account for one of the tenant\'s employees. They get an SMS / email invite.', 'user-plus', () => `<div class="alert brand" style="margin-bottom:16px">${I('info')}<div class="ab"><b>Adding to ${tname()}</b><span>This is recorded in the tenant's activity and the platform audit log.</span></div></div><div class="fgrid">${input('Full name', '', { req: 1, id: 'ta-n' })}${input('Phone', '+251', { req: 1, id: 'ta-p' })}${input('Email', '', { cls: 'full', id: 'ta-e' })}${select('Role', ROLES.map(r => r.name), { req: 1, id: 'ta-r' })}${select('Branch', ['Head office', 'Addis Ababa', 'Adama', 'Kality workshop'], { id: 'ta-b' })}${select('Password', ['Send invite to set password', 'Set a temporary password'], { cls: 'full', id: 'ta-pw' })}</div>`, 'Add employee', 'Employee added · invite sent'],
  aplan: ['Change plan', 'Upgrades apply now (prorated). Downgrades apply at the next renewal.', 'package', () => `<div class="grid g3" style="gap:12px">${PLANS.map((p, i) => `<label class="card" style="padding:14px;cursor:pointer;${i === 1 ? 'border-color:var(--border-brand);box-shadow:var(--ring-brand)' : ''}"><b class="strong">${p.name}</b><div class="tnum" style="font-weight:600;margin-top:4px">${p.price}</div><div class="small muted">${p.limit}</div></label>`).join('')}</div><div class="fgrid" style="margin-top:16px">${select('Billing', ['Monthly', 'Annual (10% off)'], { id: 'ap-b' })}${select('Apply', ['Now (prorated)', 'At next renewal'], { id: 'ap-w' })}${input('Discount', '', { val: '0', addon: '%', id: 'ap-d' })}${input('Note to tenant', 'Optional', { id: 'ap-n' })}</div>`, 'Change plan', 'Plan updated'],
  suspend: ['Suspend access', 'Users and drivers can no longer sign in. Tracking data is still recorded and kept for 90 days.', 'ban', () => `<div class="fgrid">${select('Reason', ['Non-payment', 'Contract ended', 'Security concern', 'Requested by the tenant'], { cls: 'full', id: 'su-r' })}${textarea('Message to the tenant admin', 'Your account is suspended because…', 'su-m')}</div><div class="row between" style="margin-top:12px"><span>Also stop the driver app</span>${toggle(true)}</div>`, 'Suspend access', 'Tenant suspended'],
  reactivate: ['Reactivate access', 'Users and drivers can sign in again right away.', 'check', () => `<div class="fgrid">${select('Reason', ['Payment received', 'Issue resolved', 'Other'], { cls: 'full', id: 'ra-r' })}${input('Note', 'Optional', { cls: 'full', id: 'ra-n' })}</div>`, 'Reactivate', 'Tenant reactivated'],
  recpay: ['Record payment', 'For payments received outside auto-pay.', 'wallet', () => `<div class="fgrid">${select('Tenant', TN.map(t => t[0]), { req: 1, cls: 'full', id: 'rp-t' })}${select('Invoice', ['INV-26-0961 · ETB 12,420 · overdue', 'INV-26-1001 · ETB 22,724'], { cls: 'full', id: 'rp-i' })}${input('Amount', '', { val: '12,420', addon: 'ETB', id: 'rp-a' })}${select('Method', ['Telebirr', 'CBE Birr', 'Bank transfer', 'Chapa', 'Cheque'], { id: 'rp-m' })}${input('Reference / transaction ID', '', { id: 'rp-ref' })}${input('Date received', '', { val: '7 Oct 2026', icon: 'calendar', id: 'rp-d' })}${upload('Bank slip or receipt')}</div>`, 'Record payment', 'Payment recorded'],
  newinvoice: ['Create invoice', 'One-off invoice for add-ons, onboarding or adjustments.', 'receipt', () => `<div class="fgrid">${select('Tenant', TN.map(t => t[0]), { req: 1, cls: 'full', id: 'ni-t' })}${select('Item', ['Onboarding & on-site training', 'SMS bundle · 10,000', 'ERP connector', 'Custom'], { id: 'ni-i' })}${input('Amount', '', { val: '25,000', addon: 'ETB', id: 'ni-a' })}${input('VAT 15%', '', { val: '3,750', addon: 'ETB', id: 'ni-v' })}${input('Due date', '', { val: '14 Oct 2026', icon: 'calendar', id: 'ni-d' })}${textarea('Note on invoice', '', 'ni-n')}</div>`, 'Create and send', 'Invoice sent'],
  planedit: ['Edit plan', 'Changes apply to new subscriptions and at existing tenants\' next renewal.', 'package', () => `<div class="fgrid">${input('Plan name', '', { val: 'Business', id: 'pe-n' })}${input('Price per vehicle / month', '', { val: '380', addon: 'ETB', id: 'pe-p' })}${input('Vehicle limit', '', { val: '150', id: 'pe-v' })}${input('Users included', '', { val: '60', id: 'pe-u' })}${input('Free trial', '', { val: '14', addon: 'days', id: 'pe-t' })}${input('Annual discount', '', { val: '10', addon: '%', id: 'pe-d' })}</div><div class="card" style="margin-top:16px"><div class="list">${['Live tracking & alerts', 'Dispatch & trips', 'Driver app', 'Fuel', 'Compliance', 'Maintenance', 'GPS / IoT devices', 'Spare parts', 'Tires', 'Fleet costs & budgets', 'ERP / CRM integration'].map((m, i) => `<div class="li" style="align-items:center;padding:10px 16px"><div class="body"><b style="font-weight:500">${m}</b></div>${toggle(i < 10)}</div>`).join('')}</div></div>`, 'Save plan', 'Plan saved'],
  addon: ['Add-on', 'Extra capacity or services tenants can buy.', 'plus', () => `<div class="fgrid">${input('Name', '', { val: 'SMS bundle · 10,000 messages', cls: 'full', id: 'ad-n' })}${input('Price', '', { val: '1,800', addon: 'ETB', id: 'ad-p' })}${select('Billing', ['Monthly', 'One-time', 'Annual'], { id: 'ad-b' })}${select('Available on', ['All plans', 'Business and Enterprise', 'Enterprise only'], { cls: 'full', id: 'ad-a' })}</div>`, 'Save add-on', 'Add-on saved'],
  addadmin: ['Platform team member', 'Trucksload staff account.', 'user-plus', () => `<div class="fgrid">${input('Full name', '', { req: 1, id: 'aa-n' })}${input('Email', 'name@trucksload.com', { req: 1, id: 'aa-e' })}${select('Role', ['Support agent', 'Onboarding specialist', 'Billing admin', 'Super admin'], { cls: 'full', id: 'aa-r' })}</div><div class="row between" style="margin-top:12px"><span>Require two-step sign-in</span>${toggle(true)}</div>`, 'Save', 'Team member saved'],
  impersonate: ['Open tenant workspace', 'You\'ll see the workspace as their Company admin. The tenant admin is notified and everything is logged.', 'arrow-up-right', () => `<div class="fgrid">${select('Tenant', [tname(), ...TN.map(t => t[0]).filter(n => n !== tname())], { cls: 'full', id: 'im-t' })}${input('Support ticket', 'e.g. SUP-2231', { req: 1, id: 'im-s' })}${select('Access for', ['1 hour', '4 hours', 'Until I exit'], { id: 'im-d' })}${select('Access level', ['Full (as Company admin)', 'Read-only'], { cls: 'full', id: 'im-l' })}</div>`, 'Open workspace', 'Workspace opened'],
  tenantedit: ['Edit company', '', 'pencil', () => `<div class="fgrid">${input('Legal name', '', { val: tname(), cls: 'full', id: 'te-n' })}${input('TIN', '', { val: TN[state.adm.tenant][1], id: 'te-t' })}${select('City', ['Addis Ababa', 'Adama', 'Dire Dawa', 'Hawassa'], { id: 'te-c' })}${input('Primary contact', '', { val: TN[state.adm.tenant][10], id: 'te-p' })}${input('Phone', '', { val: '+251 911 812 390', id: 'te-ph' })}</div>`, 'Save', 'Company updated'],
  gateway: ['Payment gateway', 'Credentials are stored encrypted.', 'wallet', () => `<div class="fgrid">${input('Merchant ID', '', { val: '2210448', id: 'gw-m' })}${input('API key', '', { val: '••••••••••••7f2a', type: 'password', id: 'gw-k' })}${select('Mode', ['Live', 'Test'], { id: 'gw-mo' })}${input('Callback URL', '', { val: 'https://api.trucksload.com/pay/callback', cls: 'full', id: 'gw-c' })}</div>`, 'Save', 'Gateway saved'],
  template: ['Edit template', '', 'message-square', () => `<div class="fgrid">${select('Language', ['English', 'Amharic', 'Afaan Oromoo'], { id: 'tp-l' })}${select('Channel', ['SMS', 'Email'], { id: 'tp-c' })}${textarea('Message', '', 'tp-m')}</div><p class="small muted" style="margin-top:8px">Variables: {company}, {name}, {link}, {amount}, {due_date}</p>`, 'Save template', 'Template saved'],
});
function adminSidebar() {
  const r = state.adm.route;
  return `<div class="sb-top">${LOGO}<div class="tenant-chip"><b>Trucksload Platform</b><span>Super admin</span></div></div><nav class="sb-nav" aria-label="Platform">${ANAV.map(([g, items]) => `<div class="sb-group"><div class="sb-label">${g}</div>${items.map(([id, l, ic, c]) => `<button class="nav-item ${r === id || (r === 'a-tenant' && id === 'a-tenants') ? 'active' : ''}" data-go="${id}">${I(ic)}<span>${l}</span>${c ? `<span class="count ${id === 'a-billing' ? 'err' : ''}">${c}</span>` : ''}</button>`).join('')}</div>`).join('')}</nav>
  <div class="sb-foot"><div class="sb-card" style="cursor:default">${av('Nebil Ahmed', 'sm')}<span class="tx"><b>Nebil Ahmed</b><span>Super admin</span></span></div></div>`;
}
function renderAdmin() {
  const app = $('#app'); app.className = 'app admin';
  const body = (AS[state.adm.route] || AS['a-overview'])();
  app.innerHTML = `<aside class="sidebar">${adminSidebar()}</aside><div class="main"><div class="topbar">${LOGO_FULL}${btn('', 'sm icon', 'menu', 'data-nav-toggle aria-label="Open menu"')}</div><header class="hdr"><h1><span>${PAGE.title}</span>${badge('Platform admin', 'orange')}</h1><div class="hdr-r"><div class="vsep"></div><button class="bell" data-go="a-audit" aria-label="Notifications">${I('bell')}</button><div class="vsep"></div>${FLAG}<div class="who-h">${av('Nebil Ahmed', 'sm')}<div><b>Nebil Ahmed</b><span>Super admin</span></div></div></div></header><main class="content">${body}</main></div>`;
  lucide.createIcons(); $('.main').scrollTop = 0;
}
document.addEventListener('click', e => { const au = e.target.closest('[data-aud]'); if (au) window._aud = +au.dataset.aud; }, true);
document.addEventListener('click', e => {
  const t = e.target.closest('[data-adm-tenant]');
  if (t && !e.target.closest('[data-modal]')) { state.adm.tenant = +t.dataset.admTenant; go('a-tenant'); return; }
  const p = e.target.closest('[data-adm-pick]'); if (p) state.adm.tenant = +p.dataset.admPick;
  const d = e.target.closest('[data-done]');
  if (d && d.dataset.done === 'Workspace opened') { state.imp = true; state.app = 'tenant'; state.role = 'owner'; state.route = 'dashboard'; render(); }
});
/* ---------- boot ---------- */
(function boot() {
  try { document.documentElement.dataset.theme = 'light'; } catch (e) { }
  const h = (location.hash || '').slice(1);
  if (h.startsWith('a-') && AS[h]) { state.app = 'admin'; state.adm.route = h; }
  else if (h.startsWith('d-') && DS[h.slice(2)]) { state.app = 'driver'; state.drv.scr = h.slice(2); }
  else if (h && S[h]) state.route = h;
  render();
})();
</script></body></html>
